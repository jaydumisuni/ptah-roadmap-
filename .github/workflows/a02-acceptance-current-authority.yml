name: A02 Acceptance Invariant

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Verify exact clean head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain)"

      - name: Run A01 and A02 invariant regressions
        run: |
          set -euo pipefail
          mkdir -p evidence/a02-acceptance-invariant
          PYTHONPATH=tools python3 -m unittest -v \
            tools/test_check_a01_acceptance_current_authority.py \
            tools/test_check_a02_acceptance_current_authority.py \
            2>&1 | tee evidence/a02-acceptance-invariant/regressions.txt

      - name: Validate A02 acceptance invariant
        run: |
          set -euo pipefail
          python3 tools/check_a02_acceptance_current_authority.py \
            --repo-root . \
            --output evidence/a02-acceptance-invariant/validation.json

      - name: Bind exact-head evidence
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('evidence/a02-acceptance-invariant')
          validation_bytes = (root/'validation.json').read_bytes()
          regressions_bytes = (root/'regressions.txt').read_bytes()
          validation = json.loads(validation_bytes)
          evidence = {
              'record_type': 'ptah.a02.acceptance_invariant_exact_head_evidence',
              'tested_head': os.environ['TESTED_HEAD'],
              'workflow_run_id': os.environ['RUN_ID'],
              'workflow_run_attempt': os.environ['RUN_ATTEMPT'],
              'validation_sha256': hashlib.sha256(validation_bytes).hexdigest(),
              'regressions_sha256': hashlib.sha256(regressions_bytes).hexdigest(),
              'validation_status': validation['status'],
              'a02_candidate': validation['a02_candidate'],
              'a02_merge': validation['a02_merge'],
              'a02_complete': validation['a02_complete'],
              'node_runtime_proven': validation['node_runtime_proven'],
              'p01p_open': validation['p01p_open'],
          }
          (root/'exact-head-evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True)+'\n')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Confirm repository remains unchanged
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'

      - name: Retain A02 invariant evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a02-acceptance-invariant
          path: evidence/a02-acceptance-invariant
          if-no-files-found: error
          retention-days: 30
