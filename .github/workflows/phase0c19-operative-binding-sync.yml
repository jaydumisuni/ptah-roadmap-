name: Phase 0C-19 Operative Binding Synchronization

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact binding head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Verify exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain)"

      - name: Apply guarded recovery binding
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence/phase0c19-binding
          python3 tools/apply_phase0c19_binding_sync.py 2>&1 | tee evidence/phase0c19-binding/synchronization.txt

      - name: Run binding regressions
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=tools python3 -m unittest -v \
            tools/test_check_phase0c19_operational_binding.py \
            2>&1 | tee evidence/phase0c19-binding/regressions.txt

      - name: Run binding validator
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_phase0c19_operational_binding.py \
            --repo-root . \
            --output evidence/phase0c19-binding/validation.json

      - name: Run inherited permanent validators
        shell: bash
        run: |
          set -o pipefail
          {
            PYTHONPATH=tools python3 -m unittest -v \
              tools/test_check_phase0c19_acceptance.py \
              tools/test_check_master_plan_closure.py \
              tools/test_check_archive_campaign_complete.py \
              tools/test_check_platform_diagnostic_advisory.py
            python3 tools/check_phase0c19_acceptance.py --repo-root .
            python3 tools/check_master_plan_closure.py --repo-root .
            python3 tools/check_archive_campaign_complete.py --repo-root .
            python3 tools/check_platform_diagnostic_advisory.py --repo-root .
          } 2>&1 | tee evidence/phase0c19-binding/inherited.txt

      - name: Enforce three-file recovery write boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          AI_HANDOFF.md
          master-plan-index.json
          planning/PHASE0C19-DEEP-WORKSPACE-ROADMAP-ACCEPTANCE.md
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - name: Commit synchronized recovery authority
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'ptah-evidence-bot'
          git config user.email 'ptah-evidence-bot@users.noreply.github.com'
          git add -- AI_HANDOFF.md master-plan-index.json planning/PHASE0C19-DEEP-WORKSPACE-ROADMAP-ACCEPTANCE.md
          git commit -m 'Bind operative Phase 0C-19 acceptance evidence'
          git push origin "HEAD:${BRANCH}"

      - name: Retain binding diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase0c19-operative-binding-diagnostics
          path: evidence/phase0c19-binding
          if-no-files-found: warn
          retention-days: 30
