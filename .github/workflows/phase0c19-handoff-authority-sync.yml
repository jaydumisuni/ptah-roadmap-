name: Phase 0C-19 Handoff Authority Synchronization

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact correction head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain)"

      - name: Apply guarded handoff correction
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence/phase0c19-handoff-correction
          python3 tools/apply_phase0c19_handoff_correction.py \
            2>&1 | tee evidence/phase0c19-handoff-correction/synchronization.txt

      - name: Run handoff authority regressions
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=tools python3 -m unittest -v \
            tools/test_check_phase0c19_handoff_authority.py \
            2>&1 | tee evidence/phase0c19-handoff-correction/regressions.txt

      - name: Run handoff authority validator
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_phase0c19_handoff_authority.py \
            --repo-root . \
            --output evidence/phase0c19-handoff-correction/validation.json

      - name: Run inherited permanent validation
        shell: bash
        run: |
          set -o pipefail
          {
            PYTHONPATH=tools python3 -m unittest -v \
              tools/test_check_master_plan_closure.py \
              tools/test_check_archive_campaign_complete.py \
              tools/test_check_platform_diagnostic_advisory.py \
              tools/test_check_phase0c19_acceptance.py \
              tools/test_check_phase0c19_operational_binding.py
            python3 tools/check_master_plan_closure.py --repo-root .
            python3 tools/check_archive_campaign_complete.py --repo-root .
            python3 tools/check_platform_diagnostic_advisory.py --repo-root .
            python3 tools/check_phase0c19_acceptance.py --repo-root .
            python3 tools/check_phase0c19_operational_binding.py --repo-root .
          } 2>&1 | tee evidence/phase0c19-handoff-correction/inherited-validation.txt

      - name: Enforce one-file authority correction boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' AI_HANDOFF.md > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - name: Commit corrected handoff authority
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'ptah-evidence-bot'
          git config user.email 'ptah-evidence-bot@users.noreply.github.com'
          git add -- AI_HANDOFF.md
          git commit -m 'Correct Ptah current handoff authority to version 1.1.0'
          git push origin "HEAD:${BRANCH}"

      - name: Retain correction diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase0c19-handoff-authority-diagnostics
          path: evidence/phase0c19-handoff-correction
          if-no-files-found: warn
          retention-days: 30
