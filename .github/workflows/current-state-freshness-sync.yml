name: Current State Freshness Synchronization

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Verify exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain)"

      - name: Apply guarded correction
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_current_state_freshness_correction.py

      - name: Verify corrected current state and permanent authorities
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '**Last updated:** 2026-07-25' CURRENT_STATE.md
          grep -Fq '## Phase 0C decisions and evidence now recorded' CURRENT_STATE.md
          grep -Fq 'The following records are merged:' CURRENT_STATE.md
          grep -Fq '**Active work unit:** 0C-04 / P01' CURRENT_STATE.md
          grep -Fq '**Runtime implementation:** NOT AUTHORIZED' CURRENT_STATE.md
          grep -Fq 'ADR-0033: PROPOSED' CURRENT_STATE.md
          grep -Fq 'physical-host collection: NOT STARTED' CURRENT_STATE.md
          PYTHONPATH=tools python3 -m unittest -v \
            tools/test_check_phase0c19_operational_binding.py \
            tools/test_check_phase0c19_acceptance.py \
            tools/test_check_master_plan_closure.py \
            tools/test_check_archive_campaign_complete.py \
            tools/test_check_platform_diagnostic_advisory.py
          python3 tools/check_phase0c19_operational_binding.py --repo-root .
          python3 tools/check_phase0c19_acceptance.py --repo-root .
          python3 tools/check_master_plan_closure.py --repo-root .
          python3 tools/check_archive_campaign_complete.py --repo-root .
          python3 tools/check_platform_diagnostic_advisory.py --repo-root .

      - name: Enforce one-file authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'CURRENT_STATE.md'

      - name: Commit corrected authority
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'ptah-evidence-bot'
          git config user.email 'ptah-evidence-bot@users.noreply.github.com'
          git add CURRENT_STATE.md
          git commit -m 'Correct current-state freshness markers'
          git push origin "HEAD:${BRANCH}"
